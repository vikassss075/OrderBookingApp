<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
        <link rel="stylesheet" href="style.css">
        <script defer src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js"></script>
    <script defer src="script.js"></script>
</head>
<body>
        <div class="container mt-1">
        <div class="card shadow-sm mx-auto" >
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Booking App</h4>
            </div>

    <div class="card-body">

        <form id="bookingForm">

            <div class="mb-3">
            <label for="price" class="form-label">Choose Price</label>
            <input type="number" id="price" name="price">
            </div>

            <div class="mb-3">
            <label for="dish" class="form-label">Choose Dish</label>
            <input type="text" id="dish" name="dish">
            </div>

            <div class="mb-3">
            <label for="table" class="form-label">Choose Table</label>
            <select name="table" id="table">
                <option value="Table 1" id="table1">Table 1</option>
                <option value="Table 2" id="table2">Table 2</option>
                <option value="Table 3" id="table3">Table 3</option>
            </select>
            </div>
            <button id="AddBtn" type="submit" class="btn btn-primary w-100">Add to bill</button>
        </form>
    </div>
    <div class="orders mt-4 mx-auto" style="max-width: 500px;">
        <h2>Orders</h2>
        <ul id="orderList" class="list-group"></ul>
    </div>
</body>

</html>
